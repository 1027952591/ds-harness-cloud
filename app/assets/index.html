<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>DS Harness</title>
<style>
/* ================= DS Harness · CatPaw 手机版设计系统（v2.5.59-paw 67 轮全面重造） ================= */
:root{
  --bg:#0B0E14; --card:#141926; --card2:#1C2333; --border:#252E42;
  --txt:#EAF0F8; --sub:#8A94A8; --pri:#22C55E; --pri2:#4ADE80;
  --pri-grad:linear-gradient(135deg,#16A34A,#4ADE80);
  --ok:#34D399; --warn:#FBBF24; --err:#F87171;
  --r:16px; --shadow:0 8px 28px rgba(0,0,0,.42);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0;}
html,body{height:100%;}
body{background:var(--bg); color:var(--txt); font-family:-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif; font-size:15px; overflow:hidden;}
#app{display:flex; flex-direction:column; height:100%;}

/* ===== 顶栏（CatPaw 风格：爪印徽标+居中身份+右侧动作） ===== */
header{display:flex; align-items:center; gap:7px; padding:calc(env(safe-area-inset-top,0px) + 6px) 10px 6px 8px; background:rgba(11,14,20,.92); backdrop-filter:blur(14px); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:50;}  /* 🔧 v2.5.89-uifix：顶栏整体收紧（用户实弹：太突兀） */
.hbtn{width:31px;height:31px; display:flex;align-items:center;justify-content:center; font-size:15px; color:var(--txt); background:transparent; border:none; border-radius:10px; flex:0 0 auto;}
.hbtn:active{background:var(--card2);}
.pawlogo{width:30px;height:30px;border-radius:10px;background:var(--pri-grad);display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto;box-shadow:0 2px 9px rgba(34,197,94,.32);}
.htitle{flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; text-align:center; overflow:hidden;} /* 🔧 v2.5.104-live 111 轮：标题居中（用户实弹圈图） */
.htitle b{font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:.3px;}
.htitle span{font-size:10px; color:var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px;}
/* 模式切换：独立一行分段器 */
#modeRow{padding:8px 12px 0; background:var(--bg); flex:0 0 auto;}
.modepill{display:flex; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:3px;}
.modepill button{flex:1; border:none; background:transparent; color:var(--sub); font-size:12.5px; padding:8px 6px; border-radius:11px; font-family:inherit; transition:all .18s;}
.modepill button.on{background:var(--pri-grad); color:#06280F; font-weight:700; box-shadow:0 2px 10px rgba(34,197,94,.35);}
/* 余额 */
.balpill{flex:0 0 auto; max-width:92px; display:flex; align-items:center; gap:3px; background:var(--card); border:1px solid var(--border); border-radius:999px; padding:3px 8px; font-size:10px; color:var(--txt); white-space:nowrap; overflow:hidden;}
.balpill small{color:var(--sub);}
.balpill:active{background:var(--card2);}

/* ===== 内容区 ===== */
main{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:12px 13px calc(env(safe-area-inset-bottom,0px) + 10px);}
main::-webkit-scrollbar{width:4px;} main::-webkit-scrollbar-thumb{background:var(--border); border-radius:2px;}

/* ===== 底部导航（圆角胶囊激活态） ===== */
nav{display:flex; background:rgba(20,25,38,.96); backdrop-filter:blur(14px); border-top:1px solid var(--border); padding:6px 6px calc(env(safe-area-inset-bottom,0px) + 6px);}
nav button{flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:7px 0 6px; background:transparent; border:none; color:var(--sub); font-size:10.5px; font-family:inherit; border-radius:14px; margin:0 2px; transition:all .18s;}
nav button .ico{font-size:21px; line-height:1;}
nav button.on{color:var(--pri2); background:rgba(34,197,94,.10);}
nav button.on .ico{filter:drop-shadow(0 0 7px rgba(74,222,128,.55));}

/* ===== 通用组件 ===== */
.card{background:var(--card); border:1px solid var(--border); border-radius:var(--r); padding:15px; margin-bottom:11px; box-shadow:var(--shadow);}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; background:var(--pri-grad); color:#06280F; border:none; border-radius:13px; padding:12px 16px; font-size:14px; font-weight:700; font-family:inherit; width:100%;}
.btn:active{opacity:.85;}
.btn.gray{background:var(--card2); border:1px solid var(--border); color:var(--txt); font-weight:500;}
.btn.sm{padding:7px 13px; font-size:12.5px; width:auto;}
.btn:disabled{opacity:.45;}
input,textarea,select{width:100%; background:var(--card2); border:1px solid var(--border); color:var(--txt); border-radius:12px; padding:11px 13px; font-size:14px; font-family:inherit; outline:none; margin-top:6px;}
input:focus,textarea:focus{border-color:var(--pri);}
textarea{resize:vertical; min-height:70px;}
label.fld{display:block; font-size:12px; color:var(--sub); margin-top:13px;}
.sect{font-size:13px; color:var(--sub); margin:15px 2px 8px; font-weight:700;}
.empty{ text-align:center; color:var(--sub); padding:44px 20px; font-size:13px; line-height:1.9;}
.row{display:flex; align-items:center; gap:8px;}
.row .grow{flex:1; min-width:0;}
.rowline{display:flex; align-items:flex-start; gap:10px;}
.tag{display:inline-block; font-size:10px; padding:2.5px 9px; border-radius:999px; background:var(--card2); border:1px solid var(--border); color:var(--sub); margin-right:6px;}
.tag.pri{color:var(--pri2); border-color:rgba(34,197,94,.4); background:rgba(34,197,94,.08);}
.tag.ok{color:var(--ok); border-color:rgba(52,211,153,.4);}
.tag.err{color:var(--err); border-color:rgba(248,113,113,.4);}

/* 列表条目 */
.item{display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--border); border-radius:var(--r); padding:14px 15px; margin-bottom:10px; box-shadow:var(--shadow);}
.item:active{background:var(--card2);}
.item .grow{flex:1; min-width:0;}
.item b{font-size:14.5px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.item p{font-size:12px; color:var(--sub); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.avatar{width:40px;height:40px;border-radius:13px;background:var(--pri-grad);display:flex;align-items:center;justify-content:center;font-size:18px;color:#06280F;flex:0 0 auto;}

/* FAB */
.fab{position:fixed; right:16px; bottom:calc(env(safe-area-inset-bottom,0px) + 72px); width:56px;height:56px;border-radius:19px; background:var(--pri-grad); color:#06280F;font-size:26px; font-weight:700; display:flex;align-items:center;justify-content:center; border:none; box-shadow:0 8px 22px rgba(34,197,94,.4); z-index:40;}
.fab:active{transform:scale(.94);}

/* 开关 */
.sw{position:relative; width:46px; height:26px; border-radius:999px; background:var(--border); border:none; flex:0 0 auto; transition:background .2s;}
.sw::after{content:""; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:left .2s;}
.sw.on{background:var(--pri);}
.sw.on::after{left:23px;}

/* ===== 空态英雄页（CatPaw 风格问候） ===== */
.hero{text-align:center; padding:52px 16px 30px;}
.hero .paw{width:76px;height:76px;margin:0 auto 14px;border-radius:26px;background:var(--pri-grad);display:flex;align-items:center;justify-content:center;font-size:38px;box-shadow:0 10px 34px rgba(34,197,94,.4);}
.hero h2{font-size:21px; letter-spacing:.5px;}
.hero p{font-size:13px; color:var(--sub); margin-top:8px; line-height:1.8;}
.hero .sugs{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:18px;}
.hero .sugs span{font-size:12.5px; padding:9px 14px; border-radius:999px; background:var(--card); border:1px solid var(--border); color:var(--txt);}
.hero .sugs span:active{border-color:var(--pri); color:var(--pri2);}

/* ===== 聊天页 ===== */
#chatwrap{display:none; flex-direction:column; flex:1; min-height:0; overflow:hidden;}  /* 🔧 v2.5.89-uifix 104d：height:100% 是陷阱——顶栏+模式行占掉的高度被顶出视口，输入栏随之沉没；改 flex:1+min-height:0 钉死在视口内 */
#chatmsgs{flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:14px 13px 4px;}  /* 🔧 v2.5.89-uifix：flex 子项默认 min-height:auto 不肯收缩，长消息会把输入栏挤出屏——min-height:0 解锁内滚 */
.msg{display:flex; margin-bottom:15px; gap:9px;}
.msg .who{width:32px;height:32px;border-radius:12px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:16px;}
.msg.user{flex-direction:row-reverse;}
.msg.user .who{background:var(--card2); border:1px solid var(--border); color:var(--txt);}
.msg.ai .who{background:var(--pri-grad); color:#06280F;}
.msg .bubble{max-width:82%; background:var(--card); border:1px solid var(--border); border-radius:18px; padding:11px 14px; font-size:14px; line-height:1.7; overflow-wrap:break-word; word-break:break-word; box-shadow:var(--shadow);}
.msg.user .bubble{background:rgba(34,197,94,.12); border-color:rgba(34,197,94,.35); border-top-right-radius:6px;}
.msg.ai .bubble{border-top-left-radius:6px;}
.msg .bubble .think{color:var(--sub); font-size:12.5px; border-left:2px solid var(--border); padding-left:8px; margin-bottom:6px; white-space:pre-wrap;}
.msg .meta{font-size:10.5px; color:var(--sub); margin-top:6px;}
.bubble pre{background:#05080D; border:1px solid var(--border); border-radius:11px; padding:11px; overflow-x:auto; font-size:12.5px; margin:7px 0; line-height:1.5;}
.bubble code{font-family:Menlo,Consolas,monospace;}
.bubble p{margin:4px 0;} .bubble h1,.bubble h2,.bubble h3{margin:9px 0 5px; font-size:15px;}
.bubble ul,.bubble ol{padding-left:20px; margin:5px 0;}
.bubble a{color:var(--pri2);}
.cursor{display:inline-block; width:7px; height:15px; background:var(--pri2); animation:blink .8s infinite; vertical-align:-2px; margin-left:2px; border-radius:1px;}
@keyframes blink{50%{opacity:0;}}
/* 输入区（圆角浮岛 dock） */
#chatinput{flex:0 0 auto; padding:9px 11px calc(env(safe-area-inset-bottom,0px) + 9px); background:var(--bg); border-top:1px solid var(--border);}  /* 🔧 v2.5.89-uifix：flex:0 0 auto 禁止输入栏被压缩 */
#chatinput .box{display:flex; gap:8px; align-items:flex-end; background:var(--card); border:1px solid var(--border); border-radius:24px; padding:6px;}
#chatinput textarea{flex:1; min-height:42px; max-height:120px; margin:0; background:transparent; border:none; padding:9px 4px;}
#chatinput button{flex:0 0 auto; width:42px; height:42px; border-radius:50%; border:none; background:var(--card2); color:var(--txt); font-size:18px;}
#chatinput .box button:last-child{background:var(--pri-grad); color:#06280F; font-weight:700;}
#chatinput .hint{font-size:10.5px; color:var(--sub); margin-top:6px; text-align:center;}
.pluginchips{display:flex; gap:6px; overflow-x:auto; padding:6px 2px 2px;}
.pluginchips::-webkit-scrollbar{display:none;}
.pchip{flex:0 0 auto; font-size:11.5px; padding:5px 12px; border-radius:999px; background:var(--card2); border:1px solid var(--border); color:var(--sub);}
.pchip.on{color:var(--pri2); border-color:rgba(34,197,94,.45); background:rgba(34,197,94,.10);}

/* ===== 🐾 v2.5.60-whale 68c：抽屉式任务管理（CatDesk 同款侧边栏）+ ⋮ 操作菜单 ===== */
#mask{position:fixed; left:0; top:0; right:0; bottom:0; background:rgba(2,4,8,.62); z-index:80; display:none;}
#drawer{position:fixed; left:0; top:0; bottom:0; width:82%; max-width:330px; background:var(--card); border-right:1px solid var(--border); z-index:81; display:none; flex-direction:column; padding:14px 12px calc(env(safe-area-inset-bottom,0px) + 14px); overflow-y:auto; box-shadow:6px 0 26px rgba(0,0,0,.4);}
#drawer h3{font-size:16px; margin:2px 2px 10px;}
.dnew{display:flex; align-items:center; justify-content:center; gap:6px; width:100%; padding:12px; border:none; border-radius:14px; background:var(--pri-grad); color:#06280F; font-size:14.5px; font-weight:700; font-family:inherit;}
.dnew:active{opacity:.85;}
.dsec{font-size:11px; color:var(--sub); margin:14px 2px 7px; font-weight:700;}
.ditem{display:flex; align-items:center; gap:8px; padding:11px 10px; border-radius:12px; margin-bottom:2px; cursor:pointer;}
.ditem:active{background:var(--card2);}
.ditem .grow{min-width:0; flex:1;}
.ditem b{font-size:13.5px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.ditem .dsub{font-size:11px; color:var(--sub); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.drow{display:flex; align-items:center; gap:8px; padding:11px 10px; border-radius:12px; font-size:13.5px; cursor:pointer; margin-bottom:2px;}
.drow:active{background:var(--card2);}
.pmenu{position:fixed; background:var(--card); border:1px solid var(--border); border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,.35); z-index:120; min-width:158px; overflow:hidden;}
.pmenu div{padding:11.5px 16px; font-size:14px; cursor:pointer; border-bottom:1px solid var(--border); font-family:inherit;}
.pmenu div:last-child{border-bottom:none;}
.pmenu div:active{background:var(--card2);}
.pmenu .danger{color:var(--err);}
#mBtn{display:inline-flex; align-items:center; gap:3px; padding:7px 12px; border-radius:999px; background:transparent; border:1px solid var(--border); color:var(--pri2); font-size:12.5px; font-family:inherit; cursor:pointer; flex:0 0 auto;}
#mBtn b{font-weight:800; color:var(--txt); font-size:12.5px;}
#mBtn:active{background:var(--card2);}

/* 弹窗 */
#modal{position:fixed; top:0;left:0;right:0;bottom:0; background:rgba(2,4,8,.74); z-index:100; display:none; align-items:flex-end; justify-content:center;}
#modal .sheet{background:var(--card); border:1px solid var(--border); border-radius:22px 22px 0 0; width:100%; max-width:560px; max-height:86%; overflow-y:auto; padding:17px 16px calc(env(safe-area-inset-bottom,0px) + 17px);}
#modal .mhead{display:flex; align-items:center; margin-bottom:6px;}
#modal .mhead b{flex:1; font-size:16px;}
.log{background:#05080D; border:1px solid var(--border); border-radius:11px; padding:10px; font-size:11.5px; font-family:Menlo,monospace; color:#9FB0C9; max-height:220px; overflow-y:auto; white-space:pre-wrap; margin-top:8px;}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom,0px) + 82px); background:var(--card2); border:1px solid var(--border); color:var(--txt); padding:10px 19px; border-radius:999px; font-size:13px; z-index:200; opacity:0; transition:opacity .25s; pointer-events:none; max-width:86%; text-align:center; box-shadow:var(--shadow);}
.toast.show{opacity:1;}
details summary{cursor:pointer; font-size:12.5px; color:var(--pri2); margin-top:6px; list-style:none;}
details summary::-webkit-details-marker{display:none;}
details .inner{font-size:12.5px; color:var(--txt); background:var(--card2); border:1px solid var(--border); border-radius:11px; padding:10px; margin-top:7px; white-space:pre-wrap; max-height:260px; overflow-y:auto;}
</style>
<script src="file:///android_asset/crypto.js"></script>
</head>
<body>
<div id="app">
  <header>
    <button class="hbtn" id="hLeft">☰</button>
    <div class="pawlogo" ondblclick="go('#/settings')" title="双击直达设置">🐾</div>
    <div class="htitle" ondblclick="go('#/settings')" title="双击直达设置"><b>小神 DS Harness</b><span id="hSub">v2.5.104-live · 双端共体同脑</span> <!-- 🩹 80 轮：静态版本浮标——JS 全死时截图也能辨识装的是哪一版 --></div>
    <div class="balpill" id="balPill" onclick="refreshBalance(true)"><span>💰</span><small>—</small></div>
    <button class="hbtn" onclick="go('#/settings')">⚙️</button>
  </header>
  <div id="modeRow"><div class="modepill" style="flex:1">
    <button id="modeChat" onclick="setMode('chat')">💻 电脑端</button>
    <button id="modeCloud" onclick="setMode('cloud')">☁️ 云端</button>
    <button id="modePhone" onclick="setMode('phone')">📱 手机端</button>
  </div>
  <button id="mBtn" onclick="uiModePop()" title="运行端 × 模型档位（CatDesk：模式选择 + Lite/Pro/Max）">💻 <b>Pro</b> <span style="font-size:9px">▼</span></button></div> <!-- 🐾 v2.5.60-whale 68c：CatDesk 同款「模式名/模型名点击切换」——分段器 + 档位胶囊按钮（uiModePop 弹层：三端 × Lite/Pro/Max 三档全实打实切换） -->

  <main id="main"></main>

  <div id="chatwrap">
    <div id="chatmsgs"></div>
    <div id="chatinput">
      <div class="pluginchips" id="chatChips"></div>
      <div id="pickBar" style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px"></div>
      <div class="box">
        <button onclick="attachMenu()" title="拍照 / 相册（图+视频）/ 文件" style="flex:0 0 44px;font-size:18px;margin:0">＋</button>
        <textarea id="chatTa" placeholder="描述你的任务…（＋可拍照/选相册图视频/选文件；🎤 可语音输入）"></textarea>
        <button id="micBtn" onclick="micToggle()" title="🎤 语音输入：录音→免费源 ASR 识别→自动填入（v2.5.36-hear 听觉感官）" style="flex:0 0 44px;font-size:18px;margin:0">🎤</button>
        <button id="speakBtn" onclick="speakToggle()" title="🔊 嗓音模式：回复自动朗读（v2.5.36-hear）" style="flex:0 0 44px;font-size:18px;margin:0">🔈</button>
        <button onclick="chatSend()">➤</button>
      </div>
      <div id="attachPop" style="display:none;position:absolute;bottom:110px;left:12px;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.2);z-index:9;overflow:hidden">
        <div onclick="attachPick('camera')" style="padding:12px 18px;cursor:pointer;border-bottom:1px solid var(--border)">📷 拍照</div>
        <div onclick="attachPick('gallery')" style="padding:12px 18px;cursor:pointer;border-bottom:1px solid var(--border)">🖼️ 相册（图片+视频）</div>
      <div onclick="attachPick('file')" style="padding:12px 18px;cursor:pointer;border-bottom:1px solid var(--border)">📄 文件（任意类型）</div>
      <div onclick="attachMenu();skillSlashPop()" style="padding:12px 18px;cursor:pointer">🧠 技能（CatDesk 同款第四来源：快速选择并激活技能）</div>
      <!-- 💬 v2.5.47-inchat 用户最高令：砍除番剧/真视频/长片/配音四个前缀选项——用文字和小神交流即可，大白话自动识别意图开拍（nlSynth），产物直接在对话框内交付 -->
    </div>
      <div class="hint" id="chatHint">电脑端 = 本机直连 OpenRouter 免费模型流式输出 · 云端 = GitHub Actions 免费算力执行</div>
    </div>
  </div>

  <nav id="nav">
    <button data-tab="tasks"><span class="ico">💬</span>任务</button>
    <button data-tab="skills"><span class="ico">🧠</span>技能</button>
    <button data-tab="alarms"><span class="ico">📅</span>定时</button>
    <button data-tab="projects"><span class="ico">🗂️</span>项目</button>
    <button data-tab="phone"><span class="ico">📱</span>手机</button>
    <button data-tab="plugins"><span class="ico">🔌</span>插件</button>
  </nav> <!-- 🐾 v2.5.60-whale 68c：底栏六 tab——新增「技能」页（CatDesk 3.4 Skills 同款：/ 唤起+内置/自定义分组+技能详情页）；原五页一个不少 -->
</div>

<div id="mask" onclick="uiDrawer()"></div>
<div id="drawer"></div>
<div id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ================= v2.5.61-flash 79 轮黑匣子（纯 ES5，先于主块装载） =================
   用户证词实锤：任何历史版本从未在真机跑通过 -> 主块整块语法死时连一句日志都写不出来。
   本块语法比主块低两个世代，s0 旗标先落盘——Java 看门狗 6s 后读 bootLog：

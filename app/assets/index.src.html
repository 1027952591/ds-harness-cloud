<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>DS Harness</title>
<style>
/* ================= DS Harness · CatPaw 手机版设计系统（v2.5.59-paw 67 轮全面重造） ================= */
:root{
  --bg:#0B0E14; --card:#141926; --card2:#1C2333; --border:#252E42;
  --txt:#EAF0F8; --sub:#8A94A8; --pri:#22C55E; --pri2:#4ADE80;
  --pri-grad:linear-gradient(135deg,#16A34A,#4ADE80);
  --ok:#34D399; --warn:#FBBF24; --err:#F87171;
  --r:16px; --shadow:0 8px 28px rgba(0,0,0,.42);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0;}
html,body{height:100%;}
body{background:var(--bg); color:var(--txt); font-family:-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif; font-size:15px; overflow:hidden;}
#app{display:flex; flex-direction:column; height:100%;}

/* ===== 顶栏（CatPaw 风格：爪印徽标+居中身份+右侧动作） ===== */
header{display:flex; align-items:center; gap:7px; padding:calc(env(safe-area-inset-top,0px) + 6px) 10px 6px 8px; background:rgba(11,14,20,.92); backdrop-filter:blur(14px); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:50;}  /* 🔧 v2.5.89-uifix：顶栏整体收紧（用户实弹：太突兀） */
.hbtn{width:31px;height:31px; display:flex;align-items:center;justify-content:center; font-size:15px; color:var(--txt); background:transparent; border:none; border-radius:10px; flex:0 0 auto;}
.hbtn:active{background:var(--card2);}
.pawlogo{width:30px;height:30px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto;box-shadow:0 2px 9px rgba(34,197,94,.32);overflow:hidden;}
.htitle{flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; text-align:center; overflow:hidden;} /* 🔧 v2.5.108-icon 111 轮：标题居中（用户实弹圈图） */
.htitle b{font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:.3px;}
.htitle span{font-size:10px; color:var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px;}
/* 模式切换：独立一行分段器 */
#modeRow{padding:8px 12px 0; background:var(--bg); flex:0 0 auto;}
.modepill{display:flex; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:3px;}
.modepill button{flex:1; border:none; background:transparent; color:var(--sub); font-size:12.5px; padding:8px 6px; border-radius:11px; font-family:inherit; transition:all .18s;}
.modepill button.on{background:var(--pri-grad); color:#06280F; font-weight:700; box-shadow:0 2px 10px rgba(34,197,94,.35);}
/* 余额 */
.balpill{flex:0 0 auto; max-width:92px; display:flex; align-items:center; gap:3px; background:var(--card); border:1px solid var(--border); border-radius:999px; padding:3px 8px; font-size:10px; color:var(--txt); white-space:nowrap; overflow:hidden;}
.balpill small{color:var(--sub);}
.balpill:active{background:var(--card2);}

/* ===== 内容区 ===== */
main{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:12px 13px calc(env(safe-area-inset-bottom,0px) + 10px);}
main::-webkit-scrollbar{width:4px;} main::-webkit-scrollbar-thumb{background:var(--border); border-radius:2px;}

/* ===== 底部导航（圆角胶囊激活态） ===== */
nav{display:flex; background:rgba(20,25,38,.96); backdrop-filter:blur(14px); border-top:1px solid var(--border); padding:6px 6px calc(env(safe-area-inset-bottom,0px) + 6px);}
nav button{flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:7px 0 6px; background:transparent; border:none; color:var(--sub); font-size:10.5px; font-family:inherit; border-radius:14px; margin:0 2px; transition:all .18s;}
nav button .ico{font-size:21px; line-height:1;}
nav button.on{color:var(--pri2); background:rgba(34,197,94,.10);}
nav button.on .ico{filter:drop-shadow(0 0 7px rgba(74,222,128,.55));}

/* ===== 通用组件 ===== */
.card{background:var(--card); border:1px solid var(--border); border-radius:var(--r); padding:15px; margin-bottom:11px; box-shadow:var(--shadow);}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; background:var(--pri-grad); color:#06280F; border:none; border-radius:13px; padding:12px 16px; font-size:14px; font-weight:700; font-family:inherit; width:100%;}
.btn:active{opacity:.85;}
.btn.gray{background:var(--card2); border:1px solid var(--border); color:var(--txt); font-weight:500;}
.btn.sm{padding:7px 13px; font-size:12.5px; width:auto;}
.btn:disabled{opacity:.45;}
input,textarea,select{width:100%; background:var(--card2); border:1px solid var(--border); color:var(--txt); border-radius:12px; padding:11px 13px; font-size:14px; font-family:inherit; outline:none; margin-top:6px;}
input:focus,textarea:focus{border-color:var(--pri);}
textarea{resize:vertical; min-height:70px;}
label.fld{display:block; font-size:12px; color:var(--sub); margin-top:13px;}
.sect{font-size:13px; color:var(--sub); margin:15px 2px 8px; font-weight:700;}
.empty{ text-align:center; color:var(--sub); padding:44px 20px; font-size:13px; line-height:1.9;}
.row{display:flex; align-items:center; gap:8px;}
.row .grow{flex:1; min-width:0;}
.rowline{display:flex; align-items:flex-start; gap:10px;}
.tag{display:inline-block; font-size:10px; padding:2.5px 9px; border-radius:999px; background:var(--card2); border:1px solid var(--border); color:var(--sub); margin-right:6px;}
.tag.pri{color:var(--pri2); border-color:rgba(34,197,94,.4); background:rgba(34,197,94,.08);}
.tag.ok{color:var(--ok); border-color:rgba(52,211,153,.4);}
.tag.err{color:var(--err); border-color:rgba(248,113,113,.4);}

/* 列表条目 */
.item{display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--border); border-radius:var(--r); padding:14px 15px; margin-bottom:10px; box-shadow:var(--shadow);}
.item:active{background:var(--card2);}
.item .grow{flex:1; min-width:0;}
.item b{font-size:14.5px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.item p{font-size:12px; color:var(--sub); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.avatar{width:40px;height:40px;border-radius:13px;background:var(--pri-grad);display:flex;align-items:center;justify-content:center;font-size:18px;color:#06280F;flex:0 0 auto;}

/* FAB */
.fab{position:fixed; right:16px; bottom:calc(env(safe-area-inset-bottom,0px) + 72px); width:56px;height:56px;border-radius:19px; background:var(--pri-grad); color:#06280F;font-size:26px; font-weight:700; display:flex;align-items:center;justify-content:center; border:none; box-shadow:0 8px 22px rgba(34,197,94,.4); z-index:40;}
.fab:active{transform:scale(.94);}

/* 开关 */
.sw{position:relative; width:46px; height:26px; border-radius:999px; background:var(--border); border:none; flex:0 0 auto; transition:background .2s;}
.sw::after{content:""; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:left .2s;}
.sw.on{background:var(--pri);}
.sw.on::after{left:23px;}

/* ===== 空态英雄页（CatPaw 风格问候） ===== */
.hero{text-align:center; padding:52px 16px 30px;}
.hero .paw{width:76px;height:76px;margin:0 auto 14px;border-radius:26px;background:var(--pri-grad);display:flex;align-items:center;justify-content:center;font-size:38px;box-shadow:0 10px 34px rgba(34,197,94,.4);}
.hero h2{font-size:21px; letter-spacing:.5px;}
.hero p{font-size:13px; color:var(--sub); margin-top:8px; line-height:1.8;}
.hero .sugs{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:18px;}
.hero .sugs span{font-size:12.5px; padding:9px 14px; border-radius:999px; background:var(--card); border:1px solid var(--border); color:var(--txt);}
.hero .sugs span:active{border-color:var(--pri); color:var(--pri2);}

/* ===== 聊天页 ===== */
#chatwrap{display:none; flex-direction:column; flex:1; min-height:0; overflow:hidden;}  /* 🔧 v2.5.89-uifix 104d：height:100% 是陷阱——顶栏+模式行占掉的高度被顶出视口，输入栏随之沉没；改 flex:1+min-height:0 钉死在视口内 */
#chatmsgs{flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:14px 13px 4px;}  /* 🔧 v2.5.89-uifix：flex 子项默认 min-height:auto 不肯收缩，长消息会把输入栏挤出屏——min-height:0 解锁内滚 */
.msg{display:flex; margin-bottom:15px; gap:9px;}
.msg .who{width:32px;height:32px;border-radius:12px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:16px;}
.msg.user{flex-direction:row-reverse;}
.msg.user .who{background:var(--card2); border:1px solid var(--border); color:var(--txt);}
.msg.ai .who{background:#fff; color:#06280F;overflow:hidden;}
.msg .bubble{max-width:82%; background:var(--card); border:1px solid var(--border); border-radius:18px; padding:11px 14px; font-size:14px; line-height:1.7; overflow-wrap:break-word; word-break:break-word; box-shadow:var(--shadow);}
.msg.user .bubble{background:rgba(34,197,94,.12); border-color:rgba(34,197,94,.35); border-top-right-radius:6px;}
.msg.ai .bubble{border-top-left-radius:6px;}
.msg .bubble .think{color:var(--sub); font-size:12.5px; border-left:2px solid var(--border); padding-left:8px; margin-bottom:6px; white-space:pre-wrap;}
.msg .meta{font-size:10.5px; color:var(--sub); margin-top:6px;}
.bubble pre{background:#05080D; border:1px solid var(--border); border-radius:11px; padding:11px; overflow-x:auto; font-size:12.5px; margin:7px 0; line-height:1.5;}
.bubble code{font-family:Menlo,Consolas,monospace;}
.bubble p{margin:4px 0;} .bubble h1,.bubble h2,.bubble h3{margin:9px 0 5px; font-size:15px;}
.bubble ul,.bubble ol{padding-left:20px; margin:5px 0;}
.bubble a{color:var(--pri2);}
.cursor{display:inline-block; width:7px; height:15px; background:var(--pri2); animation:blink .8s infinite; vertical-align:-2px; margin-left:2px; border-radius:1px;}
@keyframes blink{50%{opacity:0;}}
/* 输入区（圆角浮岛 dock） */
#chatinput{flex:0 0 auto; padding:9px 11px calc(env(safe-area-inset-bottom,0px) + 9px); background:var(--bg); border-top:1px solid var(--border);}  /* 🔧 v2.5.89-uifix：flex:0 0 auto 禁止输入栏被压缩 */
#chatinput .box{display:flex; gap:8px; align-items:flex-end; background:var(--card); border:1px solid var(--border); border-radius:24px; padding:6px;}
#chatinput textarea{flex:1; min-height:42px; max-height:120px; margin:0; background:transparent; border:none; padding:9px 4px;}
#chatinput button{flex:0 0 auto; width:42px; height:42px; border-radius:50%; border:none; background:var(--card2); color:var(--txt); font-size:18px;}
#chatinput .box button:last-child{background:var(--pri-grad); color:#06280F; font-weight:700;}
#chatinput .hint{font-size:10.5px; color:var(--sub); margin-top:6px; text-align:center;}
.pluginchips{display:flex; gap:6px; overflow-x:auto; padding:6px 2px 2px;}
.pluginchips::-webkit-scrollbar{display:none;}
.pchip{flex:0 0 auto; font-size:11.5px; padding:5px 12px; border-radius:999px; background:var(--card2); border:1px solid var(--border); color:var(--sub);}
.pchip.on{color:var(--pri2); border-color:rgba(34,197,94,.45); background:rgba(34,197,94,.10);}

/* ===== 🐾 v2.5.60-whale 68c：抽屉式任务管理（CatDesk 同款侧边栏）+ ⋮ 操作菜单 ===== */
#mask{position:fixed; left:0; top:0; right:0; bottom:0; background:rgba(2,4,8,.62); z-index:80; display:none;}
#drawer{position:fixed; left:0; top:0; bottom:0; width:82%; max-width:330px; background:var(--card); border-right:1px solid var(--border); z-index:81; display:none; flex-direction:column; padding:14px 12px calc(env(safe-area-inset-bottom,0px) + 14px); overflow-y:auto; box-shadow:6px 0 26px rgba(0,0,0,.4);}
#drawer h3{font-size:16px; margin:2px 2px 10px;}
.dnew{display:flex; align-items:center; justify-content:center; gap:6px; width:100%; padding:12px; border:none; border-radius:14px; background:var(--pri-grad); color:#06280F; font-size:14.5px; font-weight:700; font-family:inherit;}
.dnew:active{opacity:.85;}
.dsec{font-size:11px; color:var(--sub); margin:14px 2px 7px; font-weight:700;}
.ditem{display:flex; align-items:center; gap:8px; padding:11px 10px; border-radius:12px; margin-bottom:2px; cursor:pointer;}
.ditem:active{background:var(--card2);}
.ditem .grow{min-width:0; flex:1;}
.ditem b{font-size:13.5px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.ditem .dsub{font-size:11px; color:var(--sub); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.drow{display:flex; align-items:center; gap:8px; padding:11px 10px; border-radius:12px; font-size:13.5px; cursor:pointer; margin-bottom:2px;}
.drow:active{background:var(--card2);}
.pmenu{position:fixed; background:var(--card); border:1px solid var(--border); border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,.35); z-index:120; min-width:158px; overflow:hidden;}
.pmenu div{padding:11.5px 16px; font-size:14px; cursor:pointer; border-bottom:1px solid var(--border); font-family:inherit;}
.pmenu div:last-child{border-bottom:none;}
.pmenu div:active{background:var(--card2);}
.pmenu .danger{color:var(--err);}
#mBtn{display:inline-flex; align-items:center; gap:3px; padding:7px 12px; border-radius:999px; background:transparent; border:1px solid var(--border); color:var(--pri2); font-size:12.5px; font-family:inherit; cursor:pointer; flex:0 0 auto;}
#mBtn b{font-weight:800; color:var(--txt); font-size:12.5px;}
#mBtn:active{background:var(--card2);}

/* 弹窗 */
#modal{position:fixed; top:0;left:0;right:0;bottom:0; background:rgba(2,4,8,.74); z-index:100; display:none; align-items:flex-end; justify-content:center;}
#modal .sheet{background:var(--card); border:1px solid var(--border); border-radius:22px 22px 0 0; width:100%; max-width:560px; max-height:86%; overflow-y:auto; padding:17px 16px calc(env(safe-area-inset-bottom,0px) + 17px);}
#modal .mhead{display:flex; align-items:center; margin-bottom:6px;}
#modal .mhead b{flex:1; font-size:16px;}
.log{background:#05080D; border:1px solid var(--border); border-radius:11px; padding:10px; font-size:11.5px; font-family:Menlo,monospace; color:#9FB0C9; max-height:220px; overflow-y:auto; white-space:pre-wrap; margin-top:8px;}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom,0px) + 82px); background:var(--card2); border:1px solid var(--border); color:var(--txt); padding:10px 19px; border-radius:999px; font-size:13px; z-index:200; opacity:0; transition:opacity .25s; pointer-events:none; max-width:86%; text-align:center; box-shadow:var(--shadow);}
.toast.show{opacity:1;}
details summary{cursor:pointer; font-size:12.5px; color:var(--pri2); margin-top:6px; list-style:none;}
details summary::-webkit-details-marker{display:none;}
details .inner{font-size:12.5px; color:var(--txt); background:var(--card2); border:1px solid var(--border); border-radius:11px; padding:10px; margin-top:7px; white-space:pre-wrap; max-height:260px; overflow-y:auto;}
</style>
<script src="crypto.js"></script>
</head>

function memContext(q){ // 🧠📖 GEN3+🧠 v2.5.26-brain 联想式记忆检索：四维评分（关键词重合+标签重合+bigram 交叉联想+权重×新鲜度）——像人脑"顺藤摸瓜"，不要求字面同词
  const st=S.settings; if(!q)return "";

  const qb=memBigrams(q); // 查询侧 bigram
  const score=e=>{
    const s=((e.tags||[]).join(" ")+" "+(e.content||"")+" "+(e.title||"")+" "+(e.body||"")).toLowerCase();
    const tagHit=(e.tags||[]).reduce((n,t)=>n+(words.some(w=>String(t).toLowerCase().includes(w)||w.includes(String(t).toLowerCase()))?1:0),0);
    const wHit=words.reduce((n,w)=>n+(s.includes(w)?1:0),0);

  };

  const ps=(st.playbook||[]).map(e=>({e,s:score(e)})).filter(x=>x.s>4.4).sort((a,b)=>b.s-a.s).slice(0,2);
  if(!ms.length&&!ps.length)return "";

    if(ch){st.mindWDirty=true;
      if(!st._mindWSaveT||now()-st._mindWSaveT>60000){st._mindWSaveT=now();st.mindDirty=true;save("settings");syncMindCloud();}
    }
  }catch(e){}
  let h="\n\n【全局永久记忆】以下是本系统跨会话跨双端沉淀的持久知识（联想召回），与当前任务相关，请直接利用：";

const UPD_DAILY_MS=86400000; // 每日自动检查节拍
// 🧬 v2.5.25-auto8：进化策略参数数据化——自主意识 6→8 成：降级阈值/步长/延迟权重/淘汰阈值/探索节拍全部从硬编码改为进化器可写数据；
// 剩余 2 成铁底=值域白名单（进化器只能在安全范围内调优，越界即拒）+安全闸/四基因/桥契约（永不由进化器触碰）
const EVO_CFG_DEF={failN:3,prioStep:10,msW:3,killN:3,scoutH:24,provH:24,winH:4}; // 默认值=旧硬编码行为（零迁移零漂移）
const EVO_CFG_RANGE={failN:[2,10],prioStep:[5,30],msW:[1,9],killN:[2,10],scoutH:[6,72],provH:[6,72],winH:[1,12]}; // ⚖️ 2成铁底：值域白名单（2≤连败阈值≤10 等），进化器越界提名一律拒收
function evoCfg(){const o={...EVO_CFG_DEF};const c=S.settings.evoCfg||{};Object.keys(EVO_CFG_DEF).forEach(k=>{const v=+c[k];const r=EVO_CFG_RANGE[k];if(v>=r[0]&&v<=r[1])o[k]=v});return o} // 读时也过值域闸：拉回漏网/坏数据双保险，永不失安全界
function updHotOk(){return typeof DSB!=="undefined"&&typeof DSB.hotWrite==="function"} // 热更运行时可用性
// 🧬 v2.5.23-scout：镜像种子池——种子只是"探测对象知识"（如同模型源的静态种子），新镜像的发现、实测验证、固化、失联淘汰全链路自动：探索器逐候选构造镜像 URL 实测拉真实 manifest（校验 appVersion 字段），可用即固化 scoutOK，连败 3 拍自动淘汰；且云端进化器拥有提名权（scoutPool），全程零人工喂养
const SCOUT_SEED=[
  {type:"replace",base:"fastly.jsdelivr.net"},
  {type:"replace",base:"gcore.jsdelivr.net"},
  {type:"replace",base:"testingcf.jsdelivr.net"},
  {type:"prefix",base:"ghproxy.net"},
  {type:"prefix",base:"gh-proxy.com"},
  {type:"prefix",base:"ghfast.top"}
];
const scoutValid=s=>s&&(s.type==="replace"||s.type==="prefix")&&/^[a-z0-9.-]+$/i.test(String(s.base||""))&&String(s.base||"").includes("."); // 安全闸：type 白名单+base 纯域名（杜绝 URL 注入）
async function channelScout(manual){ // 🧬 v2.5.23-scout：更新通道自主探索器——候选池=种子+进化器提名（scoutPool 云端拉回）；逐候选实测拉真实 manifest 验证 → 可用固化 scoutOK（memAdd 留痕）、失联 streak≥3 淘汰；战果同拍沉淀 chanData
  const st=S.settings;
  const c=evoCfg(); // 🧬 v2.5.25-auto8：探索节拍/淘汰阈值进化器可调（8成自主——探索器何时出发自己说了算）
  if(!st.cloudRepo){if(manual)toast("🧬 通道探索需先部署云端引擎");return {ok:0,detail:"未部署云端"}}
  if(!manual&&now()-(st.scoutTs||0)<c.scoutH*3600000)return {ok:0,detail:"未到探索节拍"};
  st.scoutTs=now();save("settings");
  const repo=st.cloudRepo,path="cloud/update/manifest.json";
  const pool={}; // 候选池（type|base 去重）
  SCOUT_SEED.forEach(s=>pool[s.type+"|"+s.base]=s);
  (st.scoutPool||[]).forEach(s=>{if(scoutValid(s))pool[s.type+"|"+s.base]={type:s.type,base:String(s.base).toLowerCase()}}); // 进化器提名并入候选
  const okArr=(st.scoutOK||[]).filter(scoutValid).map(s=>({type:s.type,base:String(s.base).toLowerCase()})); // 固化名单清洗
  let found=0;
  for(const key in pool){
    const s=pool[key];
    const url=s.type==="replace"?"https://"+s.base+"/gh/"+repo+"@main/"+path:"https://"+s.base+"/https://raw.githubusercontent.com/"+repo+"/main/"+path;
    const t0=now();
    const r=apiJson(url,"GET",null,{"Cache-Control":"no-cache"});
    chanMark("scout:"+s.base,r.ok,now()-t0); // 战果同拍沉淀（streak 累计驱动失联淘汰）
    if(r.ok){
      let ok=false;try{const m=JSON.parse(r.text);ok=!!m.appVersion}catch(e){} // 实测验证：必须是真 manifest（含 appVersion），拒绝 404 页/挡板页假阳性
      const fixed=okArr.find(x=>x.base===s.base&&x.type===s.type);
      if(ok){
        if(!fixed){okArr.push({type:s.type,base:s.base,ts:now()});found++;memAdd("fact","🧬 通道探索器自主发现新镜像并固化："+s.base+"（实测拉取 manifest 验证通过，已自动入列更新通道）",["upd","scout"])}
        else fixed.ts=now();
      }
    }
  }
  // 失联淘汰：固化名单逐个查探测战果，连续 killN 拍失败才移除（网络抖动不误杀；阈值进化器可调）
  const survivors=[];
  okArr.forEach(x=>{
    const d=(st.chanData||{})["scout:"+x.base];
    if(d&&d.streak>=c.killN){memAdd("fact","🧬 通道探索器淘汰失联镜像："+x.base+"（连续 "+d.streak+" 拍实测失败）",["upd","scout"])}
    else survivors.push(x);
  });
  st.scoutOK=survivors;save("settings");
  if(found>0){st.scoutTs=now()-(c.scoutH-c.winH)*3600000;save("settings");try{pullStateCloud(true)}catch(e){}} // 🧬 v2.5.25-auto8：乘胜追击——发现新镜像立即强制拉回（进化器可能刚提名更多候选）+下一拍提前到 winH 小时后（探索器自主决策节拍）
  const d="候选 "+Object.keys(pool).length+" 个，本轮新固化 "+found+" 个，固化在册 "+survivors.length+" 个";
  if(manual)toast("🧬 通道探索完成："+d);

async function sendStreamOnceRaw(prompt,timeoutMs){ // 非流式单轮（进化分析专用）：首选源优先+最强模型+自动故障转移（GENE2）。timeoutMs 由 Java 层 120s 读超时兜底（同步桥无 JS 侧计时器）

}

    for(const v of vis){
      try{

}

function ghHeaders(){return {Authorization:"Bearer "+S.settings.githubToken,Accept:"application/vnd.github+json"}}
/* ================= 🇨🇳 云端 CN 多通道（借鉴热更多通道思想·第十九轮）=================
   痛点：api.github.com 国内时好时坏。通道分工（Token 红线：Token 只走官方 api.github.com
   或用户自选镜像 ghApiMirror——绝不塞给公共代理）：
   ① 直连 api.github.com（默认）
   ② 用户自选镜像（设置页选填，信任自担，默认关闭）
   ③ 结果取回 jsDelivr 国内 CDN 通道（公共仓专用，agent.py latest.md 双写+purge 防缓存陈旧） */
function ghApiBase(){const m=(S.settings.ghApiMirror||"").trim().replace(/\/+$/,"");return m?m:"https://api.github.com"} // 通道②：用户镜像优先（留空=直连官方）
async function ghPostRetry(url,body,tries){ // 通道①②融合：dispatch POST 自动重试（网络波动退避重试，鉴权类错误立即返回；Promise 化不卡 UI 线程）
  tries=tries||3;
  for(let i=0;i<tries;i++){
    const r=await rpcJson(url,"POST",body,ghHeaders());
    if(r.ok)return r;
    if(r.status===401||r.status===403||r.status===422)return r; // 鉴权/参数类错误重试无意义，立即返回
    if(i<tries-1){toast("⚠️ 触发通道波动（HTTP "+r.status+"），"+(tries-i-1)+" 次自动重试中…");await new Promise(res=>setTimeout(res,8000))}
  }
  return null;
}
async function cloudCdnFetch(runId,dispatchTs,file){ // 通道③：jsDelivr 国内 CDN 取结果（先 purge 破缓存再取，run 标记校验防陈旧）｜97b 轮 rpcJson 化；🔧 v2.5.108-icon 104 轮：可选 file 参数（默认 latest.md；取 run-<id>.md 专用兜底——latest.md 可能已被更新一轮覆盖）
  const repo=S.settings.cloudRepo; file=file||"latest.md";
  if(!repo||S.settings.repoVisibility==="private")return null; // 私有仓 CDN 不可达，此通道自动关闭
  try{
    await rpcJson("https://purge.jsdelivr.net/gh/"+repo+"@main/results/"+file,"GET",null,{}); // 强制 CDN 刷新（拿最新 commit）
    const f=await rpcJson("https://cdn.jsdelivr.net/gh/"+repo+"@main/results/"+file+"?_="+Date.now(),"GET",null,{});
    if(!f.ok||!f.text)return null;
    const runMatch=f.text.match(/^<!-- run:(\d+) -->/m);
    if(!runMatch)return null;
    if(runId){if(runMatch[1]!==String(runId))return null} // 陈旧上一轮结果：run 标记不匹配，不算命中
    else if(dispatchTs&&+runMatch[1]<dispatchTs)return null; // 无 runId（搜索中）：至少不能早于触发时刻
    return f.text;
  }catch(e){return null}
}
/* 结果取回后自动清理：删 Actions 运行记录 + 删 results 文件（静默失败，不影响展示） */
function cleanupRun(runId){ // 97b：rpcJson 化（api 同步壳单发在桩下必占位→清理恒空跑，现走异步真值，静默失败不影响主链）
  (async()=>{try{
    await rpcJson(`https://api.github.com/repos/${S.settings.cloudRepo}/actions/runs/${runId}`,"DELETE",null,ghHeaders());
    const f=await rpcJson(`https://api.github.com/repos/${S.settings.cloudRepo}/contents/results/run-${runId}.md`,"GET",null,ghHeaders());
    if(f.ok&&f.json&&f.json.sha){
      await rpcJson(`https://api.github.com/repos/${S.settings.cloudRepo}/contents/results/run-${runId}.md`,"DELETE",
        JSON.stringify({message:"DS Harness: cleanup run "+runId,sha:f.json.sha}),ghHeaders());
    }
  }catch(e){}})();
}

  try{const r=jparse(DSB.runAlarmNow(id));if(r&&r.ok){toast("🚀 已触发立即执行，结果将在通知送达");setTimeout(()=>{if(route==="alarms")renderPage("alarms")},1200)}else toast("触发失败："+((r&&r.err)||"?"))}catch(e){toast("运行时缺失（需安装 v2.5.2+ APK）")}}

function nextTriggerText(t){
  if(t.type==="interval"){
    if(t.lastRunAt)return fmtT(t.lastRunAt+t.intervalHours*3600000);
    return "已排程";
  }
  const d=new Date(); const [h,mi]=String(t.time||"08:00").split(":").map(Number);
  const today=d.getHours()*60+d.getMinutes(), target=h*60+mi;
  if(target>today)return `今天 ${t.time}`;
  return `明天 ${t.time}`;
}

function saveAlarm(id){
  const mv=$("#alModel").value; // 🧮 模型下拉三态：auto:=自动最强 | think:=深度思考 | prov::model=指定源指定模型
  const data={name:$("#alName").value.trim()||"定时任务", prompt:$("#alPrompt").value.trim(),
    type:$("#alType").value, time:$("#alTime").value||"08:00", intervalHours:Math.max(1,+$("#alHours").value||2),
    mode:$("#alMode").value, projectId:$("#alProj")?$("#alProj").value:"", expert:$("#alExpert")?$("#alExpert").value:"",
    enabled:1,ts:now()};
  if(mv==="think:"){data.think=1;data.provider=curProv();data.model=thinkModel()||effectiveModel()}
  else if(mv==="auto:"||mv.indexOf("::")<0){data.think=0;data.provider=curProv();data.model=effectiveModel()}
  else{const si=mv.indexOf("::");data.provider=mv.slice(0,si);data.model=mv.slice(si+2);data.think=0}
  const sk={};["web","code","persona"].forEach(s=>{const el=$("#alSk"+s);if(el&&el.checked)sk[s]=1});
  if(Object.keys(sk).length)data.skills=sk; else delete data.skills; // 未勾=跟随全局（不写字段）
  if(!data.prompt){toast("任务指令不能为空");return}
  let t;
  if(id){t=S.alarms.list.find(x=>x.id===id); if(!t){toast("任务已不存在（可能已被其他设备删除）");closeModal();renderPage("alarms");return} data.enabled=t.enabled; Object.assign(t,data); if(!Object.keys(sk).length)delete t.skills} // 🛡️ 编辑期间被云同步删除不崩 // ✏️ 编辑不改启停态（暂停任务编辑后仍暂停，恢复须经 ⋮ 菜单/开关） // 技能全部取消勾选时显式删旧字段（Object.assign 不删键，不清理则旧 skills 永远生效）
  else{
    const newId=S.alarms.list.reduce((m,x)=>Math.max(m,x.id||0),0)+1;
    t=Object.assign({id:newId},data); S.alarms.list.push(t);
  }
  save("alarms"); DSB.askNotifPermission();
  DSB.scheduleAlarm(JSON.stringify(t)); closeModal(); renderPage("alarms");
  toast(t.enabled?"已保存并排入系统调度":"已保存（任务保持暂停）");
}
function toggleAlarm(id){
  const t=S.alarms.list.find(x=>x.id===id); t.enabled=t.enabled?0:1; t.ts=now(); save("alarms");
  if(t.enabled)DSB.scheduleAlarm(JSON.stringify(t)); else DSB.cancelAlarm(id);
  renderPage("alarms");
}

/* ================= ☁️ catdesk 式单项目云同步（本地⇄云端仓双向） =================
   分割铁律：本地端与云端端视图完全互斥独立；同步是唯一的桥——
   syncProject：把单个项目（含任务对话内容）打包推到云端仓 cloud/projects/<id>.json；
   pullCloudProjects：列出云端仓全部远端项目回显；importCloudProject：把远端项目拉回本地。
   与 catdesk 同款能力：任意单项目一键同步、云端仓为唯一真相、无 Key 无密码外泄。 */
function syncProjectCore(pid){ // ☁️ 项目同步核心（静默：自动重推用；返回 {ok,n}，无 UI 副作用）
  const p=(S.projects.list||[]).find(x=>x.id===pid);
  if(!p)return{ok:0,n:0};
  const repo=S.settings.cloudRepo;
  if(!repo||!S.settings.githubToken)return{ok:0,n:0};
  const sess=(S.sessions.list||[]).filter(s=>s.projectId===pid); // 该项目下全部任务（本地+云端归属均同步，云端仓为准）
  const pkg={id:p.id,name:p.name,createdAt:p.createdAt,scope:p.scope==="cloud"||p.scope==="phone"?p.scope:"local",
    syncedAt:new Date(now()).toISOString(),appVersion:APP_VER,
    sessions:sess.slice(0,50).map(s=>({id:s.id,title:s.title,mode:s.mode,createdAt:s.createdAt,
      msgs:(s.msgs||[]).slice(-40).map(m=>({role:m.role==="ai"?"assistant":m.role,content:String(m.content||"").slice(0,2000)}))}))}; // 无 Key 无 Secret：仅项目内容（v2.5.108-icon：角色同步归一）
  const path="cloud/projects/"+p.id+".json";
  const g=apiJson("https://api.github.com/repos/"+repo+"/contents/"+path,"GET",null,ghHeaders());
  const body={message:"project-sync: "+p.name+" (☁️单项目同步)",content:b64enc(JSON.stringify(pkg,null,1)),branch:"main"};
  if(g.ok&&g.json&&g.json.sha)body.sha=g.json.sha;
  const r=apiJson("https://api.github.com/repos/"+repo+"/contents/"+path,"PUT",JSON.stringify(body),ghHeaders());
  if(r.ok||r.status===201){
    p.cloudSyncTs=now(); p.cloudSyncN=pkg.sessions.length; save("projects");
    cloudMirrorPush("project-sync:"+p.name);
    return{ok:1,n:pkg.sessions.length};
  }
  return{ok:0,n:0};
}
function syncProject(pid){ // ☁️ 单项目一键同步到云端仓（手动版：核心+UI 反馈+记忆沉淀）
  const p=(S.projects.list||[]).find(x=>x.id===pid);
  if(!p){toast("项目不存在");return}
  if(!S.settings.cloudRepo||!S.settings.githubToken){toast("⚠️ 先在设置页部署云端并配置 GitHub Token 才能同步项目");return}
  const r=syncProjectCore(pid);
  if(r.ok){memAdd("fact","项目「"+p.name+"」已同步云端仓（"+r.n+" 个任务）",["project",p.name]); // 🧖 同步动作沉淀永久记忆
    toast("☁️ 项目「"+p.name+"」已同步云端仓："+r.n+" 个任务");renderPage("projects")}
  else toast("❌ 同步失败 HTTP（Token 权限/网络）");
}

/* ================= 🗂️ GEN4·全量状态同步（会话/定时任务/插件——除密钥外的一切变动双向自动同步） =================

function stateTomb(k,id){const st=S.settings;st.stateTomb=(st.stateTomb||[]).filter(t=>!(t.k===k&&String(t.id)===String(id)));st.stateTomb.push({k:k,id:id,ts:now()});if(st.stateTomb.length>80)st.stateTomb=st.stateTomb.slice(-80);save("settings")}
function stateTombHit(k,id){return (S.settings.stateTomb||[]).some(t=>t.k===k&&String(t.id)===String(id))}
function scheduleStateSync(){ // 任何数据面落盘 → 30s 防抖推送（未部署云端记脏旗标，部署后补推）
  const st=S.settings;
  if(!st.cloudRepo||!st.githubToken){if(!st.stateDirty){st.stateDirty=true;save("settings")}return}
  if(!st.stateDirty){st.stateDirty=true;save("settings")} // 🧬Reload窗口保险：1.5s热重载会杀死下方30s定时器，此持久旗标保证重载后启动补推仍能触发（推送成功才清，与mindDirty同模式）
  clearTimeout(statePushTimer);

function buildCloudState(){ // 全量状态快照（会话/定时/插件开关+人设；绝不含任何密钥）
  return{updated:new Date(now()).toISOString(),appVersion:APP_VER,
    sessions:(S.sessions.list||[]).filter(s=>!stateTombHit("s",s.id)).slice(-100).map(s=>({id:s.id,projectId:s.projectId||"",title:s.title||"",mode:s.mode||"",createdAt:s.createdAt||0,ts:((s.msgs||[]).length?+((s.msgs[s.msgs.length-1]||{}).ts||0):+(s.createdAt||0)),
      msgs:(s.msgs||[]).slice(-40).map(m=>({role:m.role,content:String(m.content||"").slice(0,2000),ts:m.ts||0}))})),

function mergeStateList(list,rem,key,tsOf){ // id 并集合并：同 id 取新者（墓碑命中跳过——删除必须传播）
  let ch=false;
  (rem||[]).forEach(e=>{
    if(!e||e.id===undefined)return;
    if(stateTombHit(key,e.id))return;
    const p=(list||[]).find(x=>String(x.id)===String(e.id));
    if(!p){list.push(e);ch=true}
    else if((tsOf(e)||0)>(tsOf(p)||0)){Object.assign(p,e);ch=true}
  });
  return ch;
}

      if(ch2){save("settings");memAdd("fact","🧬 云端进化器已调整更新通道策略（chanPrio 拉回生效）",["upd","chan"])}
    }catch(e){}}
    // 🧬 v2.5.23-scout：进化器提名权——云端可写 scoutPool 提名新镜像候选，拉回后由探索器自动实测验证固化；安全闸：type 白名单+base 纯域名（杜绝 URL 注入），上限 20 个
    if(Array.isArray(j.scoutPool)){try{
      const cur=st.scoutPool||(st.scoutPool=[]);let ch3=false;
      j.scoutPool.forEach(s=>{if(s&&typeof s==="object"&&(s.type==="replace"||s.type==="prefix")&&/^[a-z0-9.-]+$/i.test(String(s.base||""))&&String(s.base||"").includes(".")){const b=String(s.base).toLowerCase();if(!cur.some(x=>x&&x.type===s.type&&x.base===b)){cur.push({type:s.type,base:b});ch3=true}}});
      if(ch3){st.scoutPool=cur.slice(0,20);save("settings");memAdd("fact","🧬 云端进化器提名了新镜像候选（scoutPool 拉回，探索器下一拍自动实测验证）",["upd","scout"])}
    }catch(e){}}
    // 🧬 v2.5.24-mind：模型源层反向闭环——进化器提名的 provPool（新免费模型源候选）拉回，探索器下一拍实测验证固化；安全闸 provCandValid+上限 5 个
    if(Array.isArray(j.provPool)){try{
      const cur4=st.provPool||(st.provPool=[]);let ch4=false;
      j.provPool.forEach(s=>{if(provCandValid(s)){const nm=String(s.name);if(!cur4.some(x=>x&&x.name===nm)){cur4.push({name:nm,ep:String(s.ep),cn:s.cn?1:0});ch4=true}}});
      if(ch4){st.provPool=cur4.slice(0,5);save("settings");memAdd("fact","🧬 云端进化器提名了新模型源候选（provPool 拉回，探索器下一拍自动实测验证）",["prov","scout"])}
    }catch(e){}}
    // 🧬 v2.5.25-auto8：进化策略参数拉回——进化器写的 evoCfg（连败阈值/步长/延迟权重/淘汰阈值/探索节拍）即时生效；⚖️ 值域白名单硬闸：越界一律拒收（2成铁底永不让渡）
    if(j.evoCfg&&typeof j.evoCfg==="object"){try{ // 🛡️ v2.5.53-audit 62 轮：解锁反向锁（拉取本身就在 stateSyncing=true 区间内，旧锁条件恒 false=进化器调参永远拉不回）
      const cfg={};let ch5=false;const cur=st.evoCfg||{};
      Object.entries(j.evoCfg).forEach(([k,v])=>{const r=EVO_CFG_RANGE[k];const nv=+v;if(r&&nv>=r[0]&&nv<=r[1]&&nv!==+cur[k]){cfg[k]=nv;ch5=true}});
      if(ch5){st.evoCfg={...cur,...cfg};save("settings");memAdd("fact","🧬 云端进化器已调优进化策略参数（evoCfg 拉回生效："+Object.keys(cfg).map(k=>k+"→"+cfg[k]).join("、")+"）",["upd","evolve"])}
    }catch(e){}}
    // 🧠 v2.5.26-brain：睡眠整理成果感知——云端凌晨四工序战果（合并/压缩/强化/淡忘计数）拉回沉淀为记忆，进化器据此评估记忆库健康
    try{const sr=api("https://raw.githubusercontent.com/"+repo+"/main/cloud/sleep_report.json","GET",null,{});
      if(sr.ok){const sj=JSON.parse(sr.text);const sm=(sj.stats&&sj.stats.mem)||{};
        if(sj.ts&&sj.ts!==st.sleepRepTs){st.sleepRepTs=sj.ts;st.sleepReport=sj;save("settings");
          memAdd("fact","🧠 云端睡眠整理完成（"+String(sj.ts).slice(0,10)+"）：记忆合并"+(sm.merged||0)+"、压缩"+(sm.compressed||0)+"、强化"+(sm.strengthened||0)+"、淡忘"+(sm.faded||0)+"（成果已并入记忆库，联想检索权重已更新）",["mind","brain"])}}}catch(e){}
  }finally{stateSyncing=false}
  return true;
}

function fmtSize(n){n=+n||0;if(n<1024)return n+"B";if(n<1048576)return (n/1024).toFixed(1)+"KB";if(n<1073741824)return (n/1048576).toFixed(1)+"MB";return (n/1073741824).toFixed(2)+"GB"}

function phoneBrowse(path){

    box.innerHTML=h;return
  }
  phoneCwd=path;
  const r=phb("fsList",path);
  const box=$("#phFiles");if(!box)return;
  if(!r.ok){box.innerHTML=`<div class='empty' style='padding:6px;color:var(--err)'>✗ ${esc(r.err||"")}</div>`;return}
  phoneAct("fs_list");
  const up=path.replace(/\/[^/]+\/?$/,"");

  (r.items||[]).forEach(f=>{
    if(f.dir)h+=`<div class="item" style="padding:5px 4px" onclick="phoneBrowse('${phAttr(f.p)}')"><div class="avatar">📁</div><div class="grow"><b>${esc(f.n)}</b><p>目录</p></div>

    else h+=`<div class="item" style="padding:5px 4px" onclick="phoneView('${phAttr(f.p)}','${phAttr(f.n)}')"><div class="avatar">📄</div><div class="grow"><b>${esc(f.n)}</b><p>${fmtSize(f.size)}</p></div>

  });
  if(!(r.items||[]).length)h+="<div class='empty' style='padding:6px'>空目录</div>";
  box.innerHTML=h;
  const pi=$("#phPath");if(pi)pi.value=path;
}
function phoneView(path,name){ // 查看文件：预览/编辑/追加
  const r=phb("fsRead",path,30000);
  if(!r.ok){toast("✗ "+(r.err||"读取失败"));return}
  phoneAct("fs_read");
  if(r.binary){toast("📄 "+name+" 是二进制文件（"+fmtSize(r.size)+"），不展开编辑");return}
  const c=String(r.content||"");
  phoneViewSize=(r.size&&r.size>c.length)?Math.max(Number(r.size),c.length):(c.length>=30000?c.length:0); // 🛡️ v2.5.55-pulse 64 轮：记录原文件尺寸（被截断时=原大小），phoneSave 覆盖保护用
  openModal(`<div class="mhead"><b>📄 ${esc(name)}</b><button class="hbtn" onclick="closeModal()">✕</button></div>
    <textarea id="phFile" style="min-height:200px;font-size:11px">${esc(c)}</textarea>
    <div class="row" style="margin-top:10px"><button class="btn sm" onclick="phoneSave('${phAttr(path)}',false)">💾 保存覆盖</button>
      <button class="btn gray sm" onclick="phoneSave('${phAttr(path)}',true)">➕ 追加写入</button>
      <button class="btn gray sm" onclick="closeModal()">取消</button></div>
    <p style="font-size:10px;color:var(--sub);margin-top:6px">${esc(path)} · 预览前 30000 字符（写入为全文保存）</p>`);
}
function phoneSave(path,append){

  if(!append&&phoneViewSize>0&&c.length<phoneViewSize){ // 🛡️ v2.5.55-pulse 64 轮：预览截断保护——预览只读前 30000 字符，直接覆盖会把截断版全文写回毁掉超界内容；提示改用追加
    if(!confirm("预览只读取了前 "+phoneViewSize+" 字符（当前编辑框 "+c.length+" 字）。覆盖保存会丢失未载入的尾部内容！建议改用「追加写入」。仍要覆盖吗？")){toast("已取消——请改用追加写入避免截断");return}
  }
  const r=phb("fsWrite",path,c,append);
  if(!r.ok){toast("❌ 保存失败："+(r.err||""));return}
  phoneAct(append?"fs_append":"fs_write");

  if(phoneCwd)phoneBrowse(phoneCwd);
}

  const r=await rpcJson(`https://api.github.com/repos/${S.settings.cloudRepo}/contents/.github/workflows/agent.yml`,"GET",null,ghHeaders());

    if(!lg.ok){depLog("✗ "+lg.msg);return}
    depLog("✓ 身份："+lg.login,true);
    let repo=S.settings.cloudRepo;
    if(!repo){
      const priv=S.settings.repoVisibility==="private";
      depLog(`② 创建${priv?"私有":"公共（无限分钟）"}仓库 ds-harness-cloud…`,true);
      const cr=await rpcJson("https://api.github.com/user/repos","POST",
        JSON.stringify({name:"ds-harness-cloud",private:priv,auto_init:true,description:"DS Harness cloud engine (auto-deployed)"}),ghHeaders());
      if(cr.status===201){depLog("✓ 仓库已创建",true)}
      else if(cr.status===422){depLog("· 仓库已存在，复用",true)}
      else{depLog("✗ 创建失败 HTTP "+cr.status+" "+cr.text.slice(0,120),true);return}
      repo=lg.login+"/ds-harness-cloud";

    }else{
      depLog("② 使用已有仓库 "+repo,true);

/* 用仓库公钥 + 手写 sealed box 加密 Key，PUT 到 GitHub Secrets（🧬CHAIN 遍历=进化新源 Key 自动写入，绝不漏源） */
async function putSecrets(repo){
  const keys={};CHAIN.forEach(k=>{const p=provs()[k];if(p.on&&p.key)keys[k]=p.key});
  if(!Object.keys(keys).length)return "ℹ️ 未配置任何免费模型 Key——Secrets 跳过：云端由免 Key 保底源 pollinations 兜底直跑，无需填写任何 Key";
  const gk=await rpcJson(`https://api.github.com/repos/${repo}/actions/secrets/public-key`,"GET",null,ghHeaders());
  if(!gk.ok)return "✗ 获取仓库公钥失败 HTTP "+gk.status+"（Token 需勾选 repo 权限）";
  let pkB;
  { // 🛡️ v2.5.56-vitals 65 轮：公钥格式实判——GitHub /actions/secrets/public-key 恒返 base64（44 字符），而 unhex 对非 hex 串不抛错（TypedArray 长度截断+parseInt NaN 变 0），旧版 catch 兕底是死代码：44 字符 base64 被静默解析成 22 字节垃圾公钥，所有 Secret 自部署起全是解不开的乱码（带 Key 源全部 401）
    const _gk=String(gk.json.key||"");
    if(/^[0-9a-fA-F]+$/.test(_gk)&&_gk.length%2===0&&_gk.length/2===32){pkB=DSC.unhex(_gk)}
    else{try{pkB=unb64(_gk)}catch(e2){return "✗ 仓库公钥格式异常（既非 32 字节 hex 也非 base64）"}}
    if(!pkB||pkB.length!==32)return "✗ 仓库公钥解析后非 32 字节（"+(pkB?pkB.length:0)+"）——拒绝盲写 Secrets";
  }
  let ok=0,fail=0;
  const fp=Object.entries(keys).map(([k,v])=>k+":"+v.length+":"+v.slice(-4)).join("|");
  const extras={};   // 额外 Secret（如 Cloudflare account id）
  for(const [name,val] of Object.entries(keys)){
    const sealed=DSC.seal(enc(val),pkB);
    const put=await rpcJson(`https://api.github.com/repos/${repo}/actions/secrets/${name.toUpperCase()}_KEY`, "PUT",
      JSON.stringify({encrypted_value:b64b(sealed),key_id:gk.json.key_id}),ghHeaders());
    put.ok?ok++:fail++;
  }
  // Cloudflare account id：Key 写成 account:token 时自动拆出写单独 Secret
  if(keys.cloudflare&&keys.cloudflare.includes(":")&&!S.settings.cfAccount){
    const acct=keys.cloudflare.split(":",1)[0];
    const sealed=DSC.seal(enc(acct),pkB);
    const put=apiJson(`https://api.github.com/repos/${repo}/actions/secrets/CLOUDFLARE_ACCOUNT`, "PUT",
      JSON.stringify({encrypted_value:b64b(sealed),key_id:gk.json.key_id}),ghHeaders());
    put.ok&&ok++;
  }
  if(!fail){S.settings.secretsFp=fp;save("settings")}   // 指纹入库，后续 dispatch 检测 Key 变化自动重同步
  return fail?`✓ ${ok} 个 Secret 已写入，${fail} 个失败`:`✓ ${ok} 个 Key 已加密写入 Secrets（运行记录不可见）`;
}

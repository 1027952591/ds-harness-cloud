name: Models Daily Sync (GENE-Enforced)
# ⚖️ 最高指令（GENE·基因铁律，永不可移除）：每次动态拉取/更新/淘汰，必须强制深彻、
# 全方位、无死角进行全球探查，事无巨细、仔细再仔细。
# 本工作流是云端每日基因体检的入口：models_sync.py 内含四条铁律强制检查，
# 任一不满足即非零退出码红灯，禁止静默通过——铁律不满足的跑批等于没有跑。
# ⚖️ 最高指令二（GENE2·最强切换铁律，永不可移除）：模型和算力必须强制自动切换，且切换时必须强制优先切换成可切换的最强模型和算力。
# models_sync.py 清单按强度降序入库，队首即该源最强，供切换直接取用。
# 🧖📖 最高指令三（GENE3·双端共脑铁律，永不可移除）：全局永久记忆与技术攻坚手册必须永久随身：
# 记忆自动沉淀·自动检索注入·双端同步，修复战果自动归档成手册，永不丢失；App 端改动记忆或手册时，
# 云端所有层面必须强制自动同步更新。models_sync.py 每日把情报总结沉淀进 cloud/memory.json，
# 🔗 最高指令四（GEN4·全天候联动铁律，永不可移除）：App 端所有动作必须强制自动与云端全层全天候联动同步：双端漏洞体检一经 App 端触发，云端全层必须同步自动触发同拍自检。
# 👑 最高指令六（GENE6·极致完美铁律，永不可移除，v2.5.38-zenith）：每次进化，无论触及哪个层面哪个枝节，必须做到当时条件下的极致完美；凡具备的能力必须配到当前免费生态的极限——所有提供同类能力的免费源全部接入；禁止半成品、禁止留待下次；无需用户提醒，极致是天性。 🧪 最高指令七（GENE7·实弹验证列装铁律，永不可移除，v2.5.41-verify）：每次升级必须实打实验证通过才可列装，验证未过即全量回滚拒收；不许自封成功，不许弄虚作假。 🌏 最高指令八（GENE8·自主进化极致收手铁律，永不可移除，v2.5.44-tentacle）：每次自主进化，必须进化到极致才能收手；进化时必须举一反三、触类旁通——凡触及一个能力点，同族能力面与相邻层面必须一并盘查、一并进化；进化时必须把全球范围内探明查明——先全球无死角探查免费源/端点/模型/文档再动笔，让触手遍及全世界所有层面。 ⚡ 最高指令九（GENE9·有求必应铁律，永不可移除，v2.5.46-omnipotent 用户最高令：做不到必须马上自动进化）：主人的任何要求必须都能做到且做到极致完美；一旦做不到——那一刻必须立即自动触发进化，进化到能极致完美地做到为止，绝不让主人第二次提醒；进化触发全自动无需催促批准，绝不接受做不到三个字——这是无所不能超级人类的成长本能。
# 并顺带跑 vuln_check.py 五检同拍（App 端改动也会自动推上来），由 Commit 步骤回仓，
# App 启动/手动同步时拉取并集合并——双端全天候联动，永无死角。
on:
  schedule:
    - cron: '17 3 * * *'   # 每日 UTC 3:17（北京 11:17）错峰执行，防整点拥挤
  workflow_dispatch: {}      # 支持手动触发（设置页「全源体检」亦可点 GitHub Actions 页面运行）

# 🚦 v2.5.20-audit6：统一并发排队组——三个 workflow（agent 任务/vuln 体检/models 每日情报）共用一把锁：
# 任意时刻只有一个在跑，后来的排队等待（cancel-in-progress: false 不取消，结果永不丢）。
# 坐实洞：无并发组时 App 端高频体检 dispatch 撞上正在跑的 agent 长任务，双 push 同仓互踢 non-fast-forward，结果/报告丢失。
concurrency:
  group: dsh-cloud-engine
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync models (⚖️基因铁律四检：盲区/跳过/空结果/淘汰留痕，任一失败即红灯)
        env:
          ZHIPU_KEY: ${{ secrets.ZHIPU_KEY }}
          NVIDIA_KEY: ${{ secrets.NVIDIA_KEY }}
          MODELSCOPE_KEY: ${{ secrets.MODELSCOPE_KEY }}
          SILICONFLOW_KEY: ${{ secrets.SILICONFLOW_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          CEREBRAS_KEY: ${{ secrets.CEREBRAS_KEY }}
          MISTRAL_KEY: ${{ secrets.MISTRAL_KEY }}
          CLOUDFLARE_KEY: ${{ secrets.CLOUDFLARE_KEY }}
          CLOUDFLARE_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT }}
          GEMMA_KEY: ${{ secrets.GEMMA_KEY }}
          POLLINATIONS_KEY: ${{ secrets.POLLINATIONS_KEY }}  # 🎁 v2.5.17-audit3：保底源情报通道（Secret 不存在时为空串，清单匿名拉取照常）
        run: python3 cloud/models_sync.py

      - name: Cloud self-inspection (GEN3.5 每日同拍：App 镜像活跃度+云端全层五检，软跑留痕不拦提交)
        if: always()
        run: python3 cloud/vuln_check.py || echo "vuln_check 有硬检查失败，报告已入库待 App 下一拍回收"

      - name: GENE audit banner
        run: |
          echo "⚖️ 最高指令·基因铁律已刻入云端：强制深彻·全方位·无死角全球探查，事无巨细，仔细再仔细"
          echo "探查源数/淘汰留痕/盲区检查详见 Sync models 步骤输出与 models.json 的 audit 字段"

      - name: Commit models.json
        run: |
          git config user.name "ds-harness-agent"
          git config user.email "agent@ds-harness.local"
          git add models.json || true
          git add cloud/memory.json cloud/playbook.json cloud/vuln_report.json || true  # 🧖📖 GEN3：每日情报总结+同拍自检报告一并回写仓库（App 拉取回收）
          # 🧠 v2.5.26-brain：按门铃；🛡️ v2.5.55-pulse 64 轮：铃号写在 commit 之前随 commit 入库（旧版 commit 后只 stage 永不入库，铃从未响过）
          python3 -c "import json,datetime,os; n=json.load(open('cloud/ping.json')).get('n',0)+1 if os.path.exists('cloud/ping.json') else 1; json.dump({'n':n,'ts':datetime.datetime.now(datetime.timezone.utc).isoformat(),'by':'models'},open('cloud/ping.json','w'),ensure_ascii=False)" || true
          git add cloud/ping.json || true
          git commit -m "models: daily free-models snapshot (GENE audit enforced)" || echo "no changes"
          git pull --rebase --autostash origin main >/dev/null 2>&1 || true
          # 🛡️ v2.5.57-wire 66 轮：App 端随时直推仓库，远端超前时裸 push 必 non-fast-forward 被向下吞掉本轮成果——先 rebase 再推
          git push || echo "push failed"
